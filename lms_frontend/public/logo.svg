<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>
    
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />  <!-- Indigo-500 -->
      <stop offset="50%" stop-color="#7c3aed" />  <!-- Violet-600 -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- Purple-500 -->
    </linearGradient>

    <linearGradient id="highlight-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" /> <!-- Lavender -->
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />  <!-- Amber-500 -->
      <stop offset="100%" stop-color="#eab308" /> <!-- Yellow-500 -->
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded card background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Subtle glowing background orb -->
  <circle cx="256" cy="256" r="160" fill="url(#brand-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Elegant glowing outer ring border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#brand-grad)" stroke-width="4" opacity="0.3" />
  
  <!-- Group for the emblem, slightly shifted for visual balance -->
  <g transform="translate(0, -10)">
    <!-- THE GRADUATION CAP (TOP PIECE - DIAMOND) -->
    <path d="M 256,120 L 400,180 L 256,240 L 112,180 Z" fill="url(#brand-grad)" filter="url(#glow)" />
    <!-- CAP BEZEL / HIGHLIGHT -->
    <path d="M 256,120 L 400,180 L 256,240 L 112,180 Z" fill="none" stroke="url(#highlight-grad)" stroke-width="3" opacity="0.8" />
    
    <!-- THE CAP'S LOWER PART (SKULL CAP) -->
    <path d="M 180,210 L 180,250 C 180,290 332,290 332,250 L 332,210 C 290,230 222,230 180,210 Z" fill="url(#brand-grad)" opacity="0.9" />
    
    <!-- THE TASSEL -->
    <path d="M 256,180 C 290,195 340,225 350,250 C 352,255 348,275 348,285" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="348" cy="290" r="10" fill="url(#gold-grad)" />
    
    <!-- THE OPEN BOOK (BASE) -->
    <!-- Left Page -->
    <path d="M 256,380 C 210,340 150,340 100,350 L 100,280 C 150,270 210,270 256,310 Z" fill="url(#brand-grad)" />
    <!-- Right Page -->
    <path d="M 256,380 C 302,340 362,340 412,350 L 412,280 C 362,270 302,270 256,310 Z" fill="url(#brand-grad)" />
    
    <!-- Book Details (Sleek light overlay) -->
    <path d="M 115,295 C 160,285 215,285 246,315 L 246,365 C 215,335 160,335 115,345 Z" fill="white" opacity="0.15" />
    <path d="M 397,295 C 352,285 297,285 266,315 L 266,365 C 297,335 352,335 397,345 Z" fill="white" opacity="0.15" />

    <!-- A glowing spark / star of learning rising from the book -->
    <path d="M 256,265 L 262,277 L 275,277 L 264,285 L 268,298 L 256,290 L 244,298 L 248,285 L 237,277 L 250,277 Z" fill="url(#gold-grad)" filter="url(#glow)" />
  </g>
</svg>
